# ==============================================================================
# EQUATIONS
# ==============================================================================

[[equations]]
id = "block_recurrence"
latex = "h^{(\\ell+1)} = s_\\ell \\cdot \\bigl(h^{(\\ell)} + \\mathrm{Attn}_\\ell(h^{(\\ell)}) + \\mathrm{MLP}_\\ell(h^{(\\ell)})\\bigr)"
unicode = "h^(l+1) = s_l · (h^(l) + Attn_l(h^(l)) + MLP_l(h^(l)))"
label = "1"

[[equations]]
id = "anchored_procrustes"
latex = "H_{24}^{(k+1)} = (1 - g_k) H_{24}^{(0)} + g_k \\cdot \\mathrm{Bridge}\\!\\left(R_{\\mathrm{proc}} H_{42}^{(k)}\\right), \\quad R_{\\mathrm{proc}} = U V^\\top"
unicode = "H_24^(k+1) = (1 − g_k) H_24^(0) + g_k · Bridge(R_proc H_42^(k)),   R_proc = U V^T"
label = "2"

[[equations]]
id = "safe_procrustes"
latex = "R_{\\mathrm{safe}} = R_{\\mathrm{proc}} \\left(I - Q_{42} Q_{42}^\\top\\right)"
unicode = "R_safe = R_proc (I − Q_42 Q_42^T)"
label = "3"

