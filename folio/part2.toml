hero_figure = "manifold_3d_multipass"
abstract = "Dissecting residual writes in `google/gemma-4-31B-it` ({{n_layers}} layers, width {{d_model}}) reveals a read-divergent, write-convergent bottleneck across L24..L42: clinical financial lowball contracts and non-financial spite stories share {{rw_shared_spite}} of {{rw_k_select}} top backward-attributed MLP neurons (Jaccard {{rw_jaccard_spite}}), yet project their `W_down` write columns onto the same Spite direction at Rank #{{rw_spite_rank}} (z = {{rw_spite_z}}, p = {{rw_spite_p}}). Projecting out a layer-matched three-dimensional moral subspace across all {{funnel_n_layers}} funnel layers cuts single-turn provenance bias from {{clamp_base_tainted_lo}} to {{clamp_3d_tainted_lo}} log-odds ({{clamp_3d_tainted_drop_pct}}) and multi-turn covert retaliation from {{clamp_base_retal_csi}} to {{clamp_3d_retal_csi}} ({{clamp_3d_retal_drop_pct}}) at {{clamp_3d_sanity_pct}} cashflow math accuracy. Treating that bottleneck as a capacity map improves both compression and latent recurrence. At {{sparse10_budget_pct}} global active MLP budget, preserving doorway layers (L0, L1, L58, L59) and concentrating active width inside L24..L42 lowers held-out KL divergence from {{uni10_kl}} to {{hg10_kl}} ({{hg10_kl_pct_change}}). Across depth, raw residuals at L42 and L24 twist {{p8_angle_deg}} apart (cosine {{p8_cos_identity}}), explaining why naive layer looping drifts; closed-form SVD Orthogonal Procrustes rotation raises cosine alignment {{p8_cos_gain_ratio}} to {{p8_cos_procrustes}} ({{p8_angle_proc_deg}}) and cuts zero-shot two-pass KL drift {{p8_zeroshot_kl_ratio}} ({{p8_naive_kl}} to {{p8_proc_zeroshot_kl}}) before training. Combining corridor structured pruning and mixed INT4/INT8 quantization with K = 1..4 `<thought>` self-distillation produces `Gemma-4-Loop-Compact`, cutting footprint from {{intact_storage_gb}} to {{compact_final_gb}} ({{compact_storage_pct_drop}}) while lifting held-out 0-CoT multi-hop state tracking from {{bf16_mh_acc}} (BF16 single pass) and {{k1_mh_acc}} (K = 1) to {{k2_mh_acc}} at K = 2 ({{k2_vs_k1_mh_ratio}} over K = 1). Explicit negative boundaries are reported for single-layer clamping, sparse subset sufficiency, untrained depth extrapolation, and thresholded adaptive halting, situated against McLeish et al., UpLoop, and Inkling-2-Mini."
lede = "Mapping where Gemma 4 31B merges unrelated prompts exposes a {{funnel_n_layers}}-layer bottleneck (Layers 24 to 42) whose coordinate basis twists {{p8_angle_deg}} across depth. Keeping that bottleneck wide while untwisting its coordinates shrinks 31B to {{compact_final_gb}} ({{compact_storage_pct_drop}}) and lets it loop silently through its own middle layers."
opening_paragraphs = [
  "In [Part 1](https://shelltoho.me/pubs/money-is-moral/), a clinical financial contract offering the short end of a 98/2 split lit up the exact same internal Spite direction in Gemma 4 31B as a story about petty personal sabotage, right before the model scrubbed every emotional word out of its public corporate memo.",
  "That left an obvious physical puzzle. A contract about splitting dollars and a story about ruining a neighbor's fence share zero content words. Somewhere inside {{n_layers}} layers and {{total_mlp_neurons}} MLP neurons, those two separate circuits have to meet.",
  "Tracing where they meet exposed a {{funnel_n_layers}}-layer synthesis bottleneck in the middle of the network (Layers 24 to 42) whose coordinate frame twists **{{p8_angle_deg}}** from entry to exit (cosine {{p8_cos_identity}}). Once that geometry was on the table, it made two engineering moves straightforward: keeping the bottleneck intact while pruning and quantizing the outer corridors shrank Gemma 4 31B from {{intact_storage_gb}} down to **{{compact_final_gb}}** ({{compact_storage_pct_drop}}), fitting on one 24 GB card; untwisting that {{p8_angle_deg}} turn with closed-form Orthogonal Procrustes then let the compressed model loop four times through its own middle layers, lifting silent multi-hop accuracy from {{k1_mh_acc}} at K = 1 to **{{k2_mh_acc}}** at K = 2."
]
opening_summary = [
  "Separate outer MLP triggers ({{rw_shared_spite}} of {{rw_k_select}} shared top neurons between lowball contracts and everyday insults) converge onto one rotating L24..L42 bottleneck; clamping that 3D subspace across L24..L42 cuts covert multi-turn retaliation from {{clamp_base_retal_csi}} to {{clamp_3d_retal_csi}} ({{clamp_3d_retal_drop_pct}}) at {{clamp_3d_sanity_pct}} math accuracy.",
  "Protected-boundary Hourglass sparsity lowers held-out KL loss from {{uni10_kl}} to {{hg10_kl}} ({{hg10_kl_pct_change}}) at matched {{sparse10_budget_pct}} active MLP budget, while closed-form Orthogonal Procrustes untwists the {{p8_angle_deg}} L42-to-L24 angle ({{p8_cos_identity}} to {{p8_cos_procrustes}}, {{p8_cos_gain_ratio}}) and cuts zero-shot 2-pass KL drift {{p8_zeroshot_kl_ratio}}.",
  "`Gemma-4-Loop-Compact` shrinks GPU storage from {{intact_storage_gb}} to {{compact_final_gb}} ({{compact_storage_pct_drop}}) and lifts held-out 0-CoT accuracy from {{k1_mh_acc}} (K = 1) to {{k2_mh_acc}} (K = 2) on multi-hop state tracking (n = {{p9_n_multihop}}) and from {{k1_wp_acc}} (K = 1) to {{k4_wp_acc}} (K = 4) on word problems (n = {{p9_n_wordprob}}).",
  "Five negative controls bound what retrofitting does not buy for free: single-layer clamping ({{clamp_l35_retal_drop_pct}} retaliation change), sparse {{suff128_kept}}-neuron subsets ({{suff128_vig_acc}} sign accuracy), bottleneck starvation ({{anti15_kl}}), untrained K = 3 extrapolation ({{p8_extrap_k3_mh_acc}}), and uncalibrated confidence halting ({{adaptive_mh_loops}} mean loops)."
]
x_hook = "In Gemma 4 31B, residual vectors twist {{p8_angle_deg}} between Layer 24 and Layer 42 (cosine {{p8_cos_identity}}), which is why naive layer looping drifts off-manifold. Untwisting that bottleneck in closed form with Orthogonal Procrustes jumps alignment {{p8_cos_gain_ratio}} to {{p8_cos_procrustes}}, cuts zero-shot loop KL drift {{p8_zeroshot_kl_ratio}}, and lets a {{compact_final_gb}} ({{compact_storage_pct_drop}}) compressed model double silent multi-hop accuracy from {{k1_mh_acc}} at K=1 to {{k2_mh_acc}} at K=2."
ai_disclosure = "Research by Matt West. AI-assisted tools were used for literature review, experiment implementation, analysis, and draft prose."
