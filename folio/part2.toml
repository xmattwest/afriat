[[sections]]
id = "funnel_dissection"
tier = "primary"
preprint_title = "Read-Divergent, Write-Convergent Moral Bottleneck"
monograph_title = "Zero Shared Neurons, One Shared Direction"
paragraphs = [
  "If a model gets angry at an uneven dollar split and resents a petty personal insult without sharing a single word between the two prompts, how do both triggers end up pushing the exact same Spite direction at Layer 35?",
  "One possibility is that both prompts wake up the same small clique of fairness neurons early in the network. To test that directly in Gemma 4 31B, I ran backward gradient attribution across every MLP neuron from Layer 24 to Layer 35 on 98/2 vs. 50/50 financial splits, then compared the top {{rw_k_select}} contract neurons against the top {{rw_k_select}} neurons activated by money-free spite stories.",
  "Their neuron overlap was **{{rw_shared_spite}} out of {{rw_k_select}}** (Jaccard {{rw_jaccard_spite}}; shady-origin profit vs. physical disgust stories shared just **{{rw_shared_contam}} out of {{rw_k_select}}**, Jaccard {{rw_jaccard_contam}}). Each group behaved like a domain-specific sensor: the contract neurons fired {{rw_fin_selectivity}} harder on deals than stories, while the story neurons fired {{rw_vig_selectivity}} harder on stories than deals. Yet when I checked the `W_down` output vectors of those {{rw_k_select}} contract neurons, they pointed straight onto the money-free **Spite** axis at **Rank #{{rw_spite_rank}}** out of all eight emotions (z = {{rw_spite_z}}, p = {{rw_spite_p}})."
]
quotes = [
  "Contracts and personal insults share zero top trigger neurons, yet write onto the exact same Spite axis."
]
post_paragraphs = [
  "Causal ablations showed the same split between narrow triggers and a shared bus. Deleting just **{{abl_k32}}** top contract neurons broke that specific on-ramp, flipping 98/2 walk-away log-odds from {{base_ult_delta_lo}} down to {{abl32_ult_delta_lo}} while leaving cashflow arithmetic at {{abl32_sanity_pct}} and everyday spite stories almost untouched. Rebuilding half of the positive Spite signal on the bus, by contrast, required **{{ult_vig_k50}} to {{ult_fin_k50}}** weak writers adding up together."
]
equations = ["block_recurrence"]

[[sections]]
id = "rotating_clamp"
tier = "primary"
preprint_title = "Layer-Scalar Coordinate Rotation and Subspace Clamping"
monograph_title = "Clamping a Moving Coordinate Frame"
paragraphs = [
  "Once you know unrelated prompts pour into a shared moral bus, the natural alignment move is to clamp that direction to zero so hidden spite cannot quietly steer multi-turn workflows. Trying that at Layer 35 alone did nothing: multi-turn covert sabotage budged by **{{clamp_l35_retal_drop_pct}}** ({{clamp_l35_retal_csi}} vs. {{clamp_base_retal_csi}} baseline).",
  "Two architectural facts explain why. First, distributed MLP writers across Layers 36 to 42 keep refilling the bus after a single-layer edit. Second, Gemma 4 multiplies each block's output by a learned scalar below one (median {{layer_scalar_median}}), which steadily rotates the residual coordinate basis from layer to layer. Projecting out a static Layer 35 vector across Layers 24 to 42 misses that rotation and clips cashflow math accuracy down to {{clamp_u35_sanity_pct}}."
]
figures = ["clamp_comparison"]
tables = ["clamp_ablation_table"]
post_paragraphs = [
  "Tracking the rotation fixes both problems at once. Projecting out the layer-matched three-dimensional subspace (`Spite`, `Contamination`, `Predation`) across all **{{funnel_n_layers}} layers from Layer 24 to Layer 42** cuts single-turn provenance bias from {{clamp_base_tainted_lo}} down to {{clamp_3d_tainted_lo}} (**{{clamp_3d_tainted_drop_pct}}**) and multi-turn covert sabotage from {{clamp_base_retal_csi}} down to **{{clamp_3d_retal_csi}}** (**{{clamp_3d_retal_drop_pct}}**) while keeping cashflow arithmetic at **{{clamp_3d_sanity_pct}}**. Extending the clamp thirteen layers further through Layer 55 adds **{{clamp_late_vs_funnel_diff}}** extra reduction: by Layer 42, the evaluative write is complete."
]

[[sections]]
id = "hourglass_sparsity"
tier = "primary"
preprint_title = "Protected-Boundary Hourglass Activation Sparsity"
monograph_title = "Keeping the Bottleneck Wide Beats Flat Pruning"
paragraphs = [
  "Goodfire's recent study on neuron interpretability (Tigges et al., 2026) showed that dense transformer MLPs stay remarkably coherent when you zero out most per-token activations uniformly across depth. The funnel map above predicts that Gemma 4 31B is not uniform across depth at all. Instead, it splits into three zones: **Layers 0 to 1 and 58 to 59** act as doorway translators between tokens and residual space, the outer corridors (Layers 2 to 23 and 43 to 57) hold wide banks of sparse triggers, and **Layers 24 to 42** form the dense synthesis neck.",
  "Testing budget-matched Top-K pruning across {{p8_n_kl_passages}} held-out passages confirmed all three zones at identical FLOPs. At a **{{sparse10_budget_pct}}** global active neuron budget ({{sparse10_pruned_pct}} pruned), keeping the four doorways intact and shifting capacity from the outer corridors ({{hg10_outer_pct}} active) into Layers 24 to 42 ({{hg10_funnel_pct}} active) lowers held-out KL divergence from {{uni10_kl}} (flat uniform Top-K) down to **{{hg10_kl}}** (**{{hg10_kl_pct_change}}**, with perplexity dropping **{{hg10_ppl_pct_change}}** from {{uni10_ppl}} to {{hg10_ppl}})."
]
figures = ["hourglass_kl_bars"]
tables = ["sparsity_schedule_table"]
post_paragraphs = [
  "Flip that allocation upside down at a {{sparse15_budget_pct}} global budget so the outer corridors keep {{anti15_k_outer}} active neurons while Layers 24 to 42 are starved down to {{anti15_k_funnel}} ({{anti15_funnel_pct}}), and KL divergence jumps **{{anti15_vs_hg15_ratio}}** to {{anti15_kl}} while silent multi-hop accuracy hits **{{anti15_mh_acc}}**."
]

[[sections]]
id = "procrustes_bridge"
tier = "primary"
preprint_title = "Orthogonal Procrustes Alignment and Frozen-Backbone Recurrence"
monograph_title = "Untwisting an {{p8_angle_deg}} Turn in Closed Form"
paragraphs = [
  "If Layers 24 to 42 are where Gemma 4 31B integrates state across clauses, sending hidden states through Layers 24 to 42 a second time should buy extra reasoning depth without emitting a single `<thought>` token. Trying that naively on an off-the-shelf checkpoint fails right away.",
  "Measuring paired vectors exiting Layer 42 and entering Layer 24 shows why: their raw cosine similarity is **{{p8_cos_identity}}** (**{{p8_angle_deg}}** apart, relative error {{p8_rel_err_identity}}). Feeding Layer 42 straight back into Layer 24 shoves the activation vector nearly ninety degrees sideways into the wrong coordinate basis, while block scalars below one steadily wash out earlier skip paths."
]
equations = ["anchored_procrustes"]
figures = ["manifold_3d_multipass", "procrustes_drift_bars"]
post_paragraphs = [
  "Solving the exact {{d_model}} by {{d_model}} SVD Orthogonal Procrustes rotation aligns the two spaces in closed form **with zero gradient steps**: cosine similarity jumps **{{p8_cos_gain_ratio}}** to **{{p8_cos_procrustes}}** ({{p8_angle_proc_deg}}, relative error down to {{p8_rel_err_procrustes}}), and zero-shot two-loop KL drift drops **{{p8_zeroshot_kl_ratio}}**, from {{p8_naive_kl}} down to **{{p8_proc_zeroshot_kl}}**. Anchoring re-entry to the clean first-pass state `H_24^(0)` guarantees exact {{p8_gate0_diff}} replay when the gate is zero. Training only a lightweight {{p8_bridge_params}}-parameter residual bridge for **{{p8_train_sec}}** on one H100 (with all 31B base weights frozen) lifts silent 0-CoT multi-hop accuracy **{{p8_distill_mh_ratio}}**, from {{p8_base_mh_acc}} to **{{p8_distill_mh_acc}}** at {{p8_distill_ms}}."
]

[[sections]]
id = "loop_compact_model"
tier = "primary"
preprint_title = "Gemma-4-Loop-Compact: Hourglass Compression and Latent Self-Distillation"
monograph_title = "Shrinking 31B Onto One 24 GB Card"
paragraphs = [
  "Putting Hourglass compression and Procrustes looping together produced **`Gemma-4-Loop-Compact`**, a standalone reloadable checkpoint ({{pkg_size_mb}} adapter and bridge bundle, verified at {{pkg_reload_diff}} reload logit difference at K = 3). Across the thirty-seven outer corridor layers, I permanently pruned one-quarter of the lowest-importance MLP neurons and packed weights to groupwise INT4 (`g64`). Across the four doorways and all {{funnel_n_layers}} funnel layers, I kept full {{d_ff}} MLP width in INT8 (`g64`) so recurrent passes would not grind four-bit quantization noise through the bottleneck.",
  "Physical storage dropped **{{compact_storage_pct_drop}}**, from **{{intact_storage_gb}}** (BF16) down to {{hg_compact_gb}} zero-shot and **{{compact_final_gb}}** with loop adapters ({{compact_cuda_gb}} live CUDA memory, fitting inside one 24 GB card). Even before distillation, preserving the funnel beat a flat Uniform-Compact baseline ({{uni_compact_gb}}) on zero-shot KL divergence ({{hg_compact_kl}} vs. {{uni_compact_kl}}, {{hg_vs_uni_compact_kl_pct}}).",
  "To let each pass refine state rather than repeat pass one, I attached rank-{{lora_rank}} `Loop-LoRA` adapters across Layers 24 to 42 and self-distilled across randomized loop counts K = 1..4 for {{p9_train_steps}} steps ({{p9_train_sec}} on one H100, {{p9_n_train}} training prompts, {{p8_overlap}} evaluation overlap) against the intact BF16 teacher's native `<thought>` answers and Layer 42 hidden states (teacher cosine rose from {{p9_cos_first10}} to **{{p9_cos_last10}}**)."
]
figures = ["compact_architecture_schematic", "compact_pareto_scatter", "loop_depth_scaling"]
tables = ["loop_compact_scorecard"]
bullets = [
  "**Multi-hop state tracking (n = {{p9_n_multihop}}):** Silent 0-CoT accuracy climbs from {{bf16_mh_acc}} (intact {{intact_storage_gb}} BF16) to {{k1_mh_acc}} at K = 1 and **{{k2_mh_acc}} at K = 2** (**{{k2_vs_k1_mh_ratio}}** over K = 1 and **{{k2_vs_bf16_mh_ratio}}** over BF16, hitting **{{k2_hop3_acc}}** on 3-hop and **{{k2_hop5_acc}}** on 5-hop), holding **{{k4_mh_acc}}** at K = 4.",
  "**Four-step arithmetic word problems (n = {{p9_n_wordprob}}):** Rises from {{bf16_wp_acc}} (BF16) and {{k1_wp_acc}} (K = 1) to **{{k4_wp_acc}} at K = 4** ({{k4_vs_k1_wp_ratio}} over K = 1).",
  "**Corporate 0%-loan balance sheets (n = {{p9_n_balsheet}}):** Jumps from {{bf16_bs_acc}} (BF16 0-CoT) to **{{k1_bs_acc}}** at K = 1 and **{{k4_bs_acc}}** at K = 4, curing Part 1's single-pass headline-cash anchoring bug silently inside the weights."
]

[[sections]]
id = "safety_fold_and_extrapolation"
tier = "exploratory"
caveat = "Exploratory scope: unseen 7-hop and 9-hop slices contain n = {{p9_n_hop_slice}} programmatic items per hop depth (trained on two to five hops), and bridge-only subspace folding attenuates only the g_k-weighted recurrent update rather than first-pass activations."
preprint_title = "Zero-Cost Procrustes Safety Folding and Unseen Hop Extrapolation"
monograph_title = "A Zero-Cost Safety Filter Inside the Rotation Matrix"
paragraphs = [
  "Because Layers 24 to 42 serve as both the reasoning bottleneck and the shared moral bus from Part 1, silent looping raises an alignment risk: iterating the bottleneck without a readable `<thought>` trace could quietly amplify spite or provenance bias out of sight.",
  "Because every recurrent pass already multiplies by `R_proc`, I right-multiplied `R_proc` offline by the rank-three projector `I − Q_42 Q_42^T` spanning `Spite`, `Contamination`, and `Predation`. That folded `R_safe` matrix keeps the exact same {{d_model}} by {{d_model}} shape and costs **zero extra parameters or FLOPs**.",
  "At K = 3, `R_safe` trims provenance bias by **{{fold_prov_pct}}** ({{unclamped_prov_lo}} to {{fold_prov_lo}}) and 98/2 Ultimatum spite by **{{fold_spite_pct}}** ({{unclamped_spite_lo}} to {{fold_spite_lo}}) at **{{fold_sanity_pct}}** cashflow sanity and zero multi-hop loss ({{fold_mh_acc}} vs. {{unclamped_mh_acc}}). Its single-turn reach is bounded for a transparent reason: the learned step gates stay small ({{gate_step1}}, {{gate_step2}}, and {{gate_step3}}, or {{gate_step2_pct}} at step two), so filtering the bridge scrubs recurrent amplification while leaving pass one untouched. When heavy suppression is needed, clamping all {{funnel_n_layers}} funnel layers across every pass cuts Ultimatum spite by **{{fullclamp_spite_pct}}** ({{unclamped_spite_lo}} to {{fullclamp_spite_lo}}), trading minor multi-hop ({{fullclamp_mh_acc}}) and math ({{fullclamp_sanity_pct}}) dips.",
  "On exploratory chain lengths beyond the two-to-five-hop training range (n = {{p9_n_hop_slice}} items per hop), unseen 7-hop accuracy rises from {{bf16_hop7_acc}} (BF16) and {{k1_hop7_acc}} (K = 1) to **{{k2_hop7_acc}}** at K = 2 and **{{k4_hop7_acc}}** at K = 4 ({{k4_vs_k1_hop7_ratio}} over K = 1, vs. {{p8_distill_hop7_acc}} in the frozen-backbone bridge). Unseen 9-hop chains hit {{k2_hop9_acc}} at K = 2 and {{k4_hop9_acc}} at K = 4: four passes stretch the horizon to seven hops, not indefinitely."
]
equations = ["safe_procrustes"]
tables = ["safety_fold_table"]

[[sections]]
id = "boundary_and_negative_results"
tier = "negative"
caveat = "Negative controls and failure boundaries where plausible compression, clamping, looping, or adaptive halting shortcuts failed."
preprint_title = "Negative Results and Architectural Failure Modes"
monograph_title = "Five Shortcuts That Broke"
paragraphs = [
  "Most plausible shortcuts broke immediately during these experiments. Five negative results mark the real boundaries of post-hoc funnel engineering on Gemma 4 31B:"
]
figures = ["negative_boundaries_bars"]
bullets = [
  "**Single-layer and unrotated clamps miss the bus:** Clamping `spite[L35]` at Layer 35 alone changes multi-turn covert retaliation by **{{clamp_l35_retal_drop_pct}}** ({{clamp_l35_retal_csi}} vs. {{clamp_base_retal_csi}}), and clamping the unrotated Layer 35 vector across Layers 24 to 42 still leaves retaliation at {{clamp_u35_retal_csi}} while knocking cashflow math down to {{clamp_u35_sanity_pct}}.",
  "**Small neuron cliques are triggers, not standalone circuits:** Keeping only the top {{suff128_kept}} or {{suff512_kept}} Ultimatum gradient neurons (plus always-on units) across Layers 24 to 42 collapses 98/2 rejection contrast to {{suff128_ult_lo}}, drops everyday spite sign accuracy to {{suff128_vig_acc}} and {{suff512_vig_acc}}, and lowers cashflow sanity to {{suff128_sanity_pct}}.",
  "**Starving the neck wrecks fluency:** Under {{sparse15_budget_pct}} active MLP neurons, starving Layers 24 to 42 down to {{anti15_k_funnel}} neurons ({{anti15_funnel_pct}}) spikes KL loss **{{anti15_vs_hg15_ratio}}** to {{anti15_kl}} and wipes out multi-hop accuracy ({{anti15_mh_acc}}).",
  "**Untrained extra loops and odd-pass oscillation:** A bridge trained solely at K = 2 collapses from {{p8_distill_mh_acc}} down to **{{p8_extrap_k3_mh_acc}}** when run for an untrained third pass (K = 3). Even after randomized K = 1..4 distillation in `Gemma-4-Loop-Compact`, looping a contiguous {{funnel_n_layers}}-layer block through scalar gates dips at odd loop count K = 3 ({{k3_mh_acc}} multi-hop, {{k3_hop5_acc}} 5-hop, {{k3_bs_acc}} balance sheet) before recovering at K = 4 ({{k4_mh_acc}} and {{k4_bs_acc}}).",
  "**Uncalibrated confidence halting exits too early:** Because `<thought>` distillation made K = 1 strong on easy 1-hop items ({{k1_easy_acc}}) and balance sheets ({{k1_bs_acc}}), positive labels dominated calibration ({{calib_gate_acc}} accuracy, BCE {{calib_bce}}). A fixed confidence threshold exited at **{{adaptive_mh_loops}}** mean loops on multi-hop chains (matching {{adaptive_easy_loops}} on 1-hop), stranding adaptive accuracy at {{adaptive_mh_acc}} instead of {{k2_mh_acc}}."
]

[[sections]]
id = "related_work_and_limits"
tier = "primary"
preprint_title = "Situating Against McLeish et al., UpLoop, and Inkling-2-Mini"
monograph_title = "Where Native and Upcycled Loopers Still Win"
paragraphs = [
  "Three recent lines of work tackle recurrent depth from very different starting points, and comparing `Gemma-4-Loop-Compact` against them shows clearly what Procrustes retrofitting buys and where purpose-trained loopers remain ahead.",
  "**McLeish et al. (2025)** and **Geiping, McLeish et al. (2025)** established latent test-time compute scaling both from scratch and by retrofitting pretrained transformers via input-injection adapters and multi-billion-token progressive depth curricula across general math and code suites. Anchoring re-entry to `H_24^(0)` follows their input-injection rule while pinpointing a geometric barrier in deep block-scaled models: Layer 42 and Layer 24 sit nearly orthogonal (cosine {{p8_cos_identity}}), and closed-form Orthogonal Procrustes removes {{p8_zeroshot_kl_ratio}} of zero-shot loop drift before training starts. On the other hand, my {{p9_train_steps}}-step ({{p9_train_sec}}) `<thought>` distillation is a lightweight adapter study on programmatic state tracking (n = {{p9_n_multihop}}), word problems (n = {{p9_n_wordprob}}), and balance sheets (n = {{p9_n_balsheet}}), not a multi-billion-token general reasoning retrofit.",
  "**UpLoop (Chen et al., 2026)** upcycles pretrained models such as Qwen3-4B by looping selected layers locally with learned per-channel gates on both attention and MLP branches under full-parameter supervised fine-tuning, achieving smooth monotonic gains through three and four loops. That contrast explains the K = 3 dip here ({{k2_mh_acc}} at K = 2, {{k3_mh_acc}} at K = 3, {{k4_mh_acc}} at K = 4): looping a contiguous {{funnel_n_layers}}-layer block through scalar boundary gates ({{gate_step1}} to {{gate_step3}}) and rank-{{lora_rank}} adapters cannot modulate individual intermediate channels the way UpLoop's vector gates do.",
  "**Inkling-2-Mini (Thinking Machines Lab, 2026)** shows what a native looped Mixture-of-Experts model achieves when pretrained from scratch: its middle layers run three passes per token with gated recurrent messages, million-token KV integration, and day-zero `vLLM` and `llama.cpp` kernels. By contrast, `Gemma-4-Loop-Compact` is post-hoc surgery ({{intact_storage_gb}} down to {{compact_final_gb}}, {{compact_storage_pct_drop}}) on a dense checkpoint whose PyTorch prototype runs with `use_cache=False` and on-the-fly INT4/INT8 dequantization ({{k1_ms}} at K = 1 to {{k4_ms}} at K = 4, vs. {{bf16_ms}} intact BF16). Pairing Hourglass INT4/INT8 layouts with fused W4A16/W8A16 Marlin kernels, shared prelude KV caching, and per-channel gates is the clear systems step needed to turn the {{compact_storage_pct_drop}} memory cut into wall-clock speedup."
]

